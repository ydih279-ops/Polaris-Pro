services:
  - type: web
    name: polaris-pro
    runtime: node
    plan: free
    buildCommand: npm install
    # init-db is idempotent (CREATE TABLE IF NOT EXISTS); safe on every deploy.
    startCommand: node src/scripts/init-db.js && node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polaris-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false   # set this to your Render URL after first deploy
      # Optional SMTP for real alert/report emails — leave unset to log instead.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: polaris-db
    plan: free
